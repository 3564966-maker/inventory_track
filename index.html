<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Inventory Tracker</title>
</head>
<body>
  <div id="app">
    <!-- Home Dashboard -->
    <header class="card">
      <h2>Drawer Balance</h2>
      <p id="drawer-balance" style="font-size: 28px; font-weight: bold;">₪0.00</p>
    </header>

    <!-- Interactive Inventory Grid -->
    <section class="grid">
      <div class="card item-card" onclick="openPriceModal('tobacco')">
        <h3>Tobacco ✏️</h3>
        <p>Stock: <span id="stock-tobacco">0</span></p>
        <small id="price-tag-tobacco" class="price-tag"></small>
      </div>
      <div class="card item-card" onclick="openPriceModal('rollingPaper')">
        <h3>Rolling Paper ✏️</h3>
        <p>Stock: <span id="stock-rollingPaper">0</span></p>
        <small id="price-tag-rollingPaper" class="price-tag"></small>
      </div>
      <div class="card item-card" onclick="openPriceModal('filters')">
        <h3>Filters ✏️</h3>
        <p>Stock: <span id="stock-filters">0</span></p>
        <small id="price-tag-filters" class="price-tag"></small>
      </div>
      <div class="card item-card" onclick="openPriceModal('lighters')">
        <h3>Lighters ✏️</h3>
        <p>Stock: <span id="stock-lighters">0</span></p>
        <small id="price-tag-lighters" class="price-tag"></small>
      </div>
    </section>

    <button id="open-modal-btn">+ Action</button>

    <!-- Action Modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">

        <!-- POP-UP 1: Select Action -->
        <div id="step-action-select">
          <h3 style="margin-top:0;">Select Action</h3>
          <div class="bubble-grid">
            <button class="bubble-btn" data-action="invest">📥 Invest</button>
            <button class="bubble-btn" data-action="borrow">📤 Borrow</button>
            <button class="bubble-btn" data-action="buy">🛒 Buy Goods</button>
            <button class="bubble-btn" data-action="sell">🏷️ Sell Goods</button>
          </div>
          <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>

        <!-- POP-UP 2: Select Item -->
        <div id="step-item-select" class="hidden">
          <h3 id="item-step-title" style="margin-top:0;">Select Item</h3>
          <div class="bubble-grid">
            <button class="bubble-btn" data-item="tobacco">Tobacco</button>
            <button class="bubble-btn" data-item="rollingPaper">Rolling Paper</button>
            <button class="bubble-btn" data-item="filters">Filters</button>
            <button class="bubble-btn" data-item="lighters">Lighters</button>
          </div>
          <button class="cancel-btn" onclick="goToStep('step-action-select')">Back</button>
        </div>

        <!-- POP-UP 3: Enter Details -->
        <div id="step-details" class="hidden">
          <h3 id="details-title" style="margin-top:0;">Enter Details</h3>

          <div id="qty-container" class="input-group">
            <label>Quantity:</label>
            <input type="number" id="action-qty" min="1" value="1">
          </div>

          <div class="input-group">
            <label>Total Amount (₪):</label>
            <input type="number" id="action-amount" step="0.01">
            <small id="price-hint" style="color: #666; margin-top: 4px;"></small>
          </div>

          <div class="button-row">
            <button id="submit-action-btn" class="primary-btn">Save</button>
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
          </div>
        </div>

      </div>
    </div>

    <!-- POP-UP MODAL: Edit Item Prices -->
    <div id="price-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="price-modal-title" style="margin-top:0;">Edit Price</h3>
        
        <div class="input-group">
          <label>Buy Price (₪ per unit):</label>
          <input type="number" id="edit-buy-price" step="0.01">
        </div>

        <div class="input-group">
          <label>Sell Price (₪ per unit):</label>
          <input type="number" id="edit-sell-price" step="0.01">
        </div>

        <div class="button-row">
          <button id="save-price-btn" class="primary-btn">Save Prices</button>
          <button class="cancel-btn" onclick="closePriceModal()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- History -->
    <section style="margin-top: 24px;">
      <h3>History Log</h3>
      <ul id="history-list"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
